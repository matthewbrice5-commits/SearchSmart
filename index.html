<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4a2596" />
    <title>smartsearch - Find the best places to get anything</title>
    <meta
      name="description"
      content="Search for anything and get the best online stores and local places to get it."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div id="app" class="app">
        <header class="brand">
          <button type="button" id="logo" class="logo">smart<span>search</span></button>
          <p id="tagline" class="tagline">
            Tell us what you&apos;re after. We&apos;ll find the best places to get it, online or
            down the street.
          </p>
        </header>

        <form id="search-form" class="search-bar" role="search">
          <label for="q" class="sr-only">What are you looking for?</label>
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input
            id="q"
            type="search"
            placeholder="What are you looking for?"
            maxlength="200"
            autocomplete="off"
            autofocus
          />
          <button type="submit" id="submit" class="search-button" disabled>
            <span class="spinner" aria-hidden="true"></span>
            <span id="submit-label">Search</span>
          </button>
        </form>

        <div class="filters">
          <button
            type="button"
            id="filters-toggle"
            class="filters-toggle"
            aria-expanded="false"
            aria-controls="filters-panel"
          >
            <span class="filters-title">Filters</span>
            <span id="filters-summary" class="filters-summary">5 results · Any · Both</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <div id="filters-panel" class="filters-panel" hidden>
            <div class="filter-row">
              <span class="filter-label" id="count-label">Number of results</span>
              <div
                class="toggle-group"
                role="group"
                aria-labelledby="count-label"
                data-filter="count"
              >
                <button type="button" data-value="5" aria-pressed="true">5</button>
                <button type="button" data-value="10" aria-pressed="false">10</button>
                <button type="button" data-value="15" aria-pressed="false">15</button>
              </div>
            </div>

            <div class="filter-row">
              <span class="filter-label" id="price-label">Price range</span>
              <div
                class="toggle-group"
                role="group"
                aria-labelledby="price-label"
                data-filter="price"
              >
                <button type="button" data-value="any" aria-pressed="true">Any</button>
                <button type="button" data-value="budget" aria-pressed="false">$</button>
                <button type="button" data-value="mid" aria-pressed="false">$$</button>
                <button type="button" data-value="premium" aria-pressed="false">$$$</button>
              </div>
            </div>

            <div class="filter-row">
              <span class="filter-label" id="mode-label">Local or online</span>
              <div
                class="toggle-group"
                role="group"
                aria-labelledby="mode-label"
                data-filter="mode"
              >
                <button type="button" data-value="both" aria-pressed="true">Both</button>
                <button type="button" data-value="online" aria-pressed="false">Online</button>
                <button type="button" data-value="local" aria-pressed="false">Local</button>
              </div>
            </div>

            <div class="filter-row" id="near-row">
              <label class="filter-label" for="near">Near (optional)</label>
              <input
                id="near"
                class="near-input"
                placeholder="City or zip code"
                maxlength="100"
              />
            </div>
          </div>
        </div>

        <div id="examples" class="examples" aria-label="Example searches">
          <button type="button">Vintage vinyl records</button>
          <button type="button">Standing desk under $400</button>
          <button type="button">Fresh sourdough bread</button>
          <button type="button">Used road bikes</button>
        </div>

        <section id="results" class="results" aria-live="polite" aria-busy="false"></section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
